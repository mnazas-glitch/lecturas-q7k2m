<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Introducción a la economía de la salud</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#161b22;--panel:#1f2630;--texto:#e9edf1;--atenuado:#9aa6b2;--filete:#2e3742;
--acc:#e0915e;--acc2:#8fb8c9;--suave:#3a2a24;--pos:#7fc4a0;--alerta:#e2c15a;--crit:#e58a8a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--texto);font:16px/1.55 "IBM Plex Sans",system-ui,sans-serif}
a{color:var(--acc2)}
.envoltura{max-width:62rem;margin:0 auto;padding:0 16px}
header{padding:48px 0 28px;border-bottom:1px solid var(--filete)}
.antetitulo{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--acc2)}
h1{font:600 clamp(28px,5vw,44px)/1.12 "Source Serif 4",Georgia,serif;margin:10px 0 12px;color:var(--texto)}
h1 em{font-style:normal;color:var(--acc)}
.docente{color:var(--atenuado);margin:0}
.aviso{margin:24px 0 0;padding:14px 16px;border-left:3px solid var(--acc);background:var(--panel);border-radius:0 8px 8px 0}
.aviso strong{color:var(--acc)}
nav.indice{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 0}
nav.indice a{font-size:14px;text-decoration:none;color:var(--texto);border:1px solid var(--filete);border-radius:999px;padding:6px 12px}
nav.indice a:hover{border-color:var(--acc)}
section{padding:36px 0 8px}
h2{font:600 26px/1.2 "Source Serif 4",Georgia,serif;margin:0 0 6px}
.bajada{color:var(--atenuado);margin:0 0 18px}
.jornada{background:var(--panel);border:1px solid var(--filete);border-radius:12px;padding:18px;margin:0 0 18px}
.jornada-cab{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;margin:0 0 12px}
.jornada h3{font:600 20px/1.2 "Source Serif 4",Georgia,serif;margin:0}
.fecha{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--atenuado)}
.fecha.fija{color:var(--acc)}
.sesiones{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.sesiones a,.sesiones .sin{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:8px;
border:1px solid var(--filete);text-decoration:none;color:var(--texto);min-height:48px}
.sesiones a:hover{border-color:var(--acc);background:var(--suave)}
.num{font:600 13px "IBM Plex Mono",monospace;color:var(--acc);min-width:2.4em}
.sesiones .ir{margin-left:auto;color:var(--acc2);font-size:14px;white-space:nowrap}
.sesiones .sin{color:var(--atenuado);border-style:dashed}
.actividades{margin:14px 0 0;padding:12px 0 0;border-top:1px dashed var(--filete)}
.actividades h4{margin:0 0 8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--atenuado);font-weight:600}
.act{text-decoration:none;color:var(--texto);border-radius:6px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;padding:6px 0}
.act .nombre{flex:1 1 16rem}
.peso{font:600 13px "IBM Plex Mono",monospace}
.nivel{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid currentColor}
.n-pro{color:var(--crit)}.n-lim{color:var(--alerta)}.n-obl{color:var(--acc2)}.n-lib{color:var(--pos)}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--filete);border-radius:12px;overflow:hidden}
td,th{padding:12px 14px;border-bottom:1px solid var(--filete);text-align:left}
td:last-child,th:last-child{text-align:right;font-family:"IBM Plex Mono",monospace}
tr:last-child td{border-bottom:0;font-weight:600}
.nota{color:var(--atenuado);font-size:14px}
details{background:var(--panel);border:1px solid var(--filete);border-radius:10px;margin:0 0 10px}
summary{cursor:pointer;padding:14px 16px;font-weight:600}
details ul{margin:0;padding:0 16px 14px 34px}
details li{margin:0 0 8px;font-size:15px}
details h5{margin:6px 16px 8px;font-size:13px;color:var(--atenuado);text-transform:uppercase;letter-spacing:.08em}
.boton{display:inline-block;padding:12px 18px;border-radius:8px;background:var(--acc);color:#161b22;text-decoration:none;font-weight:600}
a.act:hover .nombre{color:var(--acc)}
.cerrojo p{margin:0 0 10px;color:var(--atenuado)}
.cerrojo form{display:flex;gap:8px;flex-wrap:wrap}
.cerrojo input{flex:1 1 12rem;font:16px "IBM Plex Mono",monospace;padding:10px 12px;border-radius:8px;border:1px solid var(--filete);background:var(--bg);color:var(--texto)}
.cerrojo .error{color:var(--crit);min-height:1.4em;margin:8px 0 0}
.puerta{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin:16px 0 0;padding:16px;border:1px solid var(--acc);border-radius:12px;background:var(--suave)}
.puerta>div:first-child{flex:1 1 20rem}
.puerta-acciones{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.cerrojo p a{font-weight:600}
footer{padding:36px 0 48px;color:var(--atenuado);font-size:14px;border-top:1px solid var(--filete);margin-top:36px}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.chip{font-size:13px;border:1px solid var(--filete);border-radius:999px;padding:4px 10px;color:var(--texto)}
.volver{display:inline-block;margin:0 0 14px;font-size:14px;text-decoration:none}
.bloque{padding:28px 0 0}
.bloque h2{font-size:22px}
ol.pasos{margin:0;padding-left:22px}
ol.pasos li{margin:0 0 10px}
.pestana{border:1px solid var(--filete);border-radius:12px;background:var(--panel);margin:0 0 12px;transition:border-color .2s}
.pestana:hover,.pestana[open]{border-color:var(--acc)}
.pestana summary{list-style:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:16px 18px;min-height:56px;cursor:pointer}
.pestana summary::-webkit-details-marker{display:none}
.pestana-titulo{font:600 18px "Source Serif 4",Georgia,serif}
.pestana-dato{font:600 13px "IBM Plex Mono",monospace;color:var(--atenuado)}
.pestana-flecha{margin-left:auto;width:12px;height:12px;border-right:2px solid var(--acc);border-bottom:2px solid var(--acc);transform:rotate(45deg);transition:transform .25s cubic-bezier(.2,.7,.2,1)}
.pestana[open]>summary .pestana-flecha{transform:rotate(-135deg)}
.pestana-cuerpo{padding:0 18px 18px;animation:desplegar .25s ease-out}
@keyframes desplegar{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.rubrica-resumen{list-style:none;margin:0 0 16px;padding:12px 0 0;border-top:1px solid var(--filete);display:grid;gap:6px}
.rubrica-resumen li{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.rubrica-resumen b{font:600 14px "IBM Plex Mono",monospace;color:var(--acc)}
@media (prefers-reduced-motion:reduce){.pestana-cuerpo{animation:none}.pestana-flecha{transition:none}}
.criterio{background:var(--bg);border:1px solid var(--filete);border-radius:10px;margin:0 0 12px;overflow:hidden}
.criterio-cab{list-style:none;display:flex;align-items:center;gap:12px;padding:14px;min-height:52px;font-weight:600;cursor:pointer}
.criterio-cab::-webkit-details-marker{display:none}
.criterio-cab span:first-child{flex:1}
.criterio-pts{font-family:"IBM Plex Mono",monospace;color:var(--acc)}
.criterio-cab .pestana-flecha{margin-left:4px;width:9px;height:9px}
.criterio[open]>summary .pestana-flecha{transform:rotate(-135deg)}
.criterio:hover,.criterio[open]{border-color:var(--acc)}
.criterio-cuerpo{border-top:1px solid var(--filete);animation:desplegar .25s ease-out}
.nivel-fila{display:grid;grid-template-columns:7.5rem 1fr;gap:10px;padding:10px 14px;border-bottom:1px solid var(--filete);font-size:15px}
.nivel-fila:last-child{border-bottom:0}
.nivel-fila b{font-weight:600}
.nivel-fila small{display:block;font-family:"IBM Plex Mono",monospace;color:var(--atenuado)}
@media (max-width:480px){.nivel-fila{grid-template-columns:1fr;gap:2px}}
.ia-caja{background:var(--panel);border:1px solid var(--filete);border-radius:10px;padding:14px 16px}
.ia-caja ul{margin:8px 0 0;padding-left:20px}
.pendiente{margin:18px 0 0;padding:12px 14px;border-left:3px solid var(--alerta);background:var(--panel);border-radius:0 8px 8px 0}
.lista-v{list-style:none;padding:0;margin:0}
.lista-v li{padding:8px 0 8px 30px;position:relative;border-bottom:1px dashed var(--filete)}
.lista-v li:before{content:"";position:absolute;left:4px;top:12px;width:14px;height:14px;border:2px solid var(--acc2);border-radius:3px}
.entrega{margin:28px 0 0;padding:18px;background:var(--panel);border:1px solid var(--acc);border-radius:12px}
.entrega p{margin:10px 0 0;color:var(--atenuado);font-size:14px}
.pregunta{background:var(--panel);border:1px solid var(--filete);border-radius:10px;padding:14px 16px;margin:0 0 12px}
.pregunta p{margin:0 0 10px}
.pregunta label{display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:6px;cursor:pointer;min-height:44px}
.pregunta label:hover{background:var(--suave)}
.pregunta input{margin-top:4px}
.pregunta .expl{display:none;margin:10px 0 0;padding:10px 12px;border-radius:6px;font-size:15px}
.pregunta.bien .expl{display:block;border-left:3px solid var(--pos)}
.pregunta.mal .expl{display:block;border-left:3px solid var(--crit)}
button.boton{border:0;font:inherit;font-weight:600;cursor:pointer}
#resultado{display:none;margin:18px 0 0}
section#resultado:not([hidden]){display:block} /* el resultado del control; sin esto quedaba oculto */
#resumen{width:100%;min-height:90px;margin:10px 0;font:14px "IBM Plex Mono",monospace;background:var(--bg);color:var(--texto);border:1px solid var(--filete);border-radius:8px;padding:10px}
#aviso{color:var(--alerta);min-height:1.4em}
.formulario{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:12px}
.campo{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--atenuado)}
.campo input,.campo select{font:16px "IBM Plex Sans",sans-serif;padding:10px 12px;border-radius:8px;border:1px solid var(--filete);background:var(--bg);color:var(--texto)}
.consiente{display:flex;gap:10px;align-items:flex-start;margin:16px 0 0;font-size:15px}
.consiente input{margin-top:4px}
.pregunta.ver .expl{display:block;border-left:3px solid var(--acc2)}
.candado .campo{margin:10px 0}
#barra-ctrl{position:sticky;top:0;z-index:5;display:flex;gap:12px;justify-content:space-between;align-items:center;padding:10px 14px;margin:0 0 14px;background:var(--panel);border:1px solid var(--filete);border-radius:10px;font-size:14px}
#reloj{font:600 20px "IBM Plex Mono",monospace;color:var(--acc)}
#reloj.urgente{color:var(--crit)}
#salidas-txt{color:var(--alerta)}
#velo{position:fixed;inset:0;z-index:20;background:rgba(10,12,16,.92);display:flex;align-items:center;justify-content:center;padding:16px}
#velo[hidden]{display:none}
.velo-caja{max-width:28rem;background:var(--panel);border:1px solid var(--crit);border-radius:14px;padding:22px}
.error-txt{color:var(--crit);min-height:1.4em}
.hito{background:var(--panel);border:1px solid var(--filete);border-radius:12px;padding:18px;margin:0 0 16px;scroll-margin-top:16px}
.hito:target{border-color:var(--acc)}
.hito-cab{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;justify-content:space-between;margin:0 0 6px}
.hito h3{font:600 19px/1.25 "Source Serif 4",Georgia,serif;margin:0}
.hito-fechas{color:var(--atenuado);font-size:15px}
.lectura-lista li{padding-left:30px}
.hito-botones{display:flex;flex-wrap:wrap;gap:10px}
.boton.sec{background:transparent;color:var(--texto);border:1px solid var(--filete)}
.candado{max-width:30rem;margin:12vh auto 0;padding:24px;background:var(--panel);border:1px solid var(--filete);border-radius:14px}
.candado input{width:100%;font:16px "IBM Plex Mono",monospace;padding:12px;margin:12px 0;border-radius:8px;border:1px solid var(--filete);background:var(--bg);color:var(--texto)}
.candado .error{color:var(--crit);min-height:1.4em;margin:0}

.video-act{margin:28px 0 0;border-radius:14px;overflow:hidden;border:1px solid var(--filete);background:#0e1218}
.video-act video,.video-act iframe{display:block;width:100%;height:auto;aspect-ratio:16/9;border:0;background:#0e1218}
.videos-foro{display:grid;grid-template-columns:repeat(auto-fit,minmax(18rem,1fr));gap:18px;margin:16px 0 0}
.secuencia{margin:24px 0 0;border:1px solid var(--filete);border-radius:14px;overflow:hidden;background:#0e1218}
.sec-escenario{position:relative;aspect-ratio:16/9;background:#0e1218}
.sec-escenario video,.sec-yt,.sec-yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#0e1218}
.sec-escenario [hidden]{display:none}
.sec-play{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:0 0 9%;background:linear-gradient(transparent 55%,rgba(8,12,18,.7));border:0;cursor:pointer}
.sec-play span{display:flex;align-items:center;gap:12px;padding:16px 30px;border-radius:40px;background:var(--acc);color:#0e1218;font:600 18px "IBM Plex Sans",sans-serif;letter-spacing:.04em}
.sec-play span::before{content:"";border-style:solid;border-width:10px 0 10px 16px;border-color:transparent transparent transparent #0e1218}
@media(max-width:600px){.sec-play span{padding:9px 18px;font-size:15px}}
.sec-seguir{position:absolute;right:16px;bottom:56px;z-index:2}
.sec-barra{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--panel);border-top:1px solid var(--filete)}
.sec-capitulos{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0;flex:1 1 30rem}
.sec-cap{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:7px 11px;border:1px solid var(--filete);border-radius:8px;background:transparent;color:var(--texto);cursor:pointer;font:13px "IBM Plex Sans",sans-serif;text-align:left}
.sec-cap b{font-weight:600;font-size:14px}.sec-cap small{color:var(--atenuado);font-size:12px}
.sec-cap:hover{border-color:var(--acc)}
.sec-cap.visto b::after{content:" \2713";color:var(--pos)}
.sec-cap.actual{border-color:var(--acc);background:var(--suave)}
.secuencia:fullscreen{display:flex;flex-direction:column;border:0;border-radius:0}
.secuencia:fullscreen .sec-escenario{flex:1;aspect-ratio:auto}
.video-foro{margin:0}.video-foro .video-act{margin:0}
.video-foro figcaption{display:flex;flex-direction:column;gap:2px;margin:10px 2px 0;font-size:14px;color:var(--atenuado)}
.video-foro figcaption b{color:var(--texto);font:600 16px "Source Serif 4",Georgia,serif}
.foro-tarjeta{background:var(--panel);border:1px solid var(--filete);border-radius:12px;padding:16px 18px;margin:0 0 14px}
.foro-tarjeta.mio{border-color:var(--acc)}
.foro-meta{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;margin:0 0 8px;font-size:13px;color:var(--atenuado)}
.foro-meta b{font:600 16px "Source Serif 4",Georgia,serif;color:var(--texto)}
.foro-texto{white-space:pre-wrap;line-height:1.6;margin:0}
.foro-replicas{margin:14px 0 0;padding:0 0 0 16px;border-left:2px solid var(--filete)}
.foro-replicas .foro-tarjeta{background:var(--bg);margin:10px 0 0}
.foro-editor textarea{width:100%;min-height:220px;font:16px/1.55 "IBM Plex Sans",sans-serif;padding:12px;border-radius:10px;border:1px solid var(--filete);background:var(--bg);color:var(--texto);resize:vertical}
.foro-editor.replica textarea{min-height:130px}
.contador{font:600 13px "IBM Plex Mono",monospace;color:var(--alerta);margin:6px 0 10px}
.contador.ok{color:var(--pos)}
.foro-barra{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin:0 0 16px;padding:12px 16px;border:1px solid var(--filete);border-radius:10px}
.foro-oculto{opacity:.5}
.boton.chico{min-height:40px;padding:8px 14px;font-size:14px}
.boton.sec{background:transparent;color:var(--texto);border:1px solid var(--filete)}
.boton.sec:hover{border-color:var(--acc)}
.boton:disabled{opacity:.6;cursor:wait}
.calif-fila{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px;border:1px solid var(--filete);border-radius:10px;margin:0 0 8px;background:var(--panel);cursor:pointer}
.calif-fila:hover{border-color:var(--acc)}
.calif-fila small{display:block;color:var(--atenuado);font-size:13px}
.calif-total{font:600 15px "IBM Plex Mono",monospace;color:var(--acc)}
.calif-detalle{padding:6px 4px 18px}
.nivel-opciones{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.nivel-opciones label{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border:1px solid var(--filete);border-radius:8px;cursor:pointer;font-size:13px;min-width:7.5rem}
.nivel-opciones label:has(input:checked){border-color:var(--acc);background:var(--suave)}
.nivel-opciones input{position:absolute;opacity:0}
.nivel-opciones small{font-family:"IBM Plex Mono",monospace;color:var(--atenuado)}
</style>
</head><body>
<div class="envoltura"><div class="candado" id="candado">
<div class="antetitulo">Economía y Finanzas de los Servicios de Salud</div>
<h1 style="font-size:28px">Jornada 1</h1>
<p>La jornada 1 se abre al inscribirse con la prueba diagnóstica.</p>
<p><a class="boton" href="../actividades/diagnostica/">Hacer la diagnóstica</a></p>
<p>Si ya la ganó en otro equipo, <a href="../acceso/">entre con su cédula y su contraseña</a>. También puede escribir la llave aquí.</p>
<form id="f"><input id="llave" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Escriba la llave" aria-label="Llave de la jornada 1">
<button class="boton" type="submit">Abrir</button></form>
<p class="error" id="error"></p>

<script>

/* Controles de lectura en ventana emergente, aparte del aula (17-oct-2026). */
document.addEventListener('click',function(e){
  var a=e.target.closest&&e.target.closest('a[data-ventana]'); if(!a||e.ctrlKey||e.metaKey||e.shiftKey) return;
  var an=Math.min(1100,screen.availWidth-40), al=Math.min(900,screen.availHeight-60);
  var w=window.open(a.href,'control-aula','popup=yes,width='+an+',height='+al+',left='+Math.max(0,(screen.availWidth-an)/2)+',top=20');
  if(w){e.preventDefault(); try{w.focus();}catch(x){}}
});
function normLlave(s){return s.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,'-');}
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function abrirCon(d,llave){
  try{
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(normLlave(llave)),'PBKDF2',false,['deriveKey']);
    var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(d.s),iterations:d.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    var t=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(d.iv)},k,b64(d.c));
    return new TextDecoder().decode(t);
  }catch(e){return null;}
}
function llaveGuardada(j){var M=modoDocente(); if(M&&M.llaves&&M.llaves[j]) return M.llaves[j]; try{return localStorage.getItem('econ-llave-j'+j)||sessionStorage.getItem('econ-llave-j'+j);}catch(e){return null;}}
/* En modo docente no se guarda nada del estudiante: las llaves salen del paquete docente. */
function guardarLlave(j,v){if(modoDocente()) return; try{localStorage.setItem('econ-llave-j'+j,v);}catch(e){} try{sessionStorage.setItem('econ-llave-j'+j,v);}catch(e){}}
function guardarLlaves(o){for(var j in o){if(o[j])guardarLlave(j,o[j]);}}
/* Modo docente: el paquete descifrado con la clave docente (llaves y configuración de los
   controles) queda 8 horas en este navegador o hasta que el docente sale. */
var HORAS_DOCENTE=8;
function modoDocente(){
  try{var M=JSON.parse(localStorage.getItem('econ-docente')||'null'); if(M&&M.hasta>Date.now()) return M; if(M) localStorage.removeItem('econ-docente');}catch(e){}
  return null;
}
function entrarDocente(M){M.hasta=Date.now()+HORAS_DOCENTE*3600000; try{localStorage.setItem('econ-docente',JSON.stringify(M)); return true;}catch(e){return false;}}
function salirDocente(){try{localStorage.removeItem('econ-docente');localStorage.removeItem('econ-docente-ensayo');}catch(e){}}
function barraDocente(){
  var M=modoDocente(); if(!M||document.getElementById('barra-docente')) return;
  var C=M.cfg||{}, J=document.body.dataset.control, diag=document.body.hasAttribute('data-diagnostica');
  var clave=J?(C.ctrl||{})[J]:diag?C.diag:null;
  var b=document.createElement('div'); b.id='barra-docente'; b.setAttribute('role','region'); b.setAttribute('aria-label','Modo docente');
  b.style.cssText='position:fixed;left:12px;right:12px;bottom:12px;z-index:30;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 14px;background:var(--panel,#1b2027);color:var(--texto,#e9edf1);border:1px solid var(--acc,#d9a441);border-radius:12px;font:14px/1.4 "IBM Plex Sans",sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.35)';
  var txt='<span>Todo abierto. Nada se envía al servidor ni a la hoja de calificaciones.</span>';
  if(J&&clave){
    var E={}; try{E=JSON.parse(localStorage.getItem('econ-docente-ensayo')||'{}');}catch(e){}
    var usados=((E.int||{})[J]||[]).length, n=clave.length, min=Math.ceil(C.umbral*n-1e-9);
    txt+='<span>Control de la jornada '+J+': '+n+' preguntas, aprueba con '+min+' aciertos ('+Math.round(C.umbral*100)+' %), '+C.intentos+' intentos de '+(typeof C.minutos==='object'?C.minutos[J]:C.minutos)+' minutos; la segunda salida de la ventana lo envía. Ensayos usados: '+usados+' de '+C.intentos+'.</span>';
  } else if(diag&&clave){
    txt+='<span>La inscripción es un ensayo: no crea ninguna fila.</span>';
  }
  var boton=function(id,t){return '<button type="button" id="'+id+'" style="background:transparent;border:1px solid var(--filete,#555);color:inherit;border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer;min-height:36px">'+t+'</button>';};
  /* En el teléfono la barra empieza plegada: solo el rótulo, que la despliega. */
  b.innerHTML='<button type="button" id="bd-plegar" aria-expanded="true" style="background:none;border:0;padding:4px 0;font:600 14px \'IBM Plex Sans\',sans-serif;color:var(--acc,#d9a441);cursor:pointer;min-height:36px">Modo docente</button>'
    +'<span id="bd-detalle" style="display:contents">'+txt+'<span style="display:flex;flex-wrap:wrap;gap:8px;margin-left:auto">'+(clave?boton('bd-clave','Ver respuestas correctas'):'')+(J?boton('bd-reiniciar','Reiniciar ensayos'):'')+boton('bd-salir','Salir del modo docente')+'</span></span>';
  document.body.appendChild(b);
  var det=document.getElementById('bd-detalle'), pl=document.getElementById('bd-plegar');
  var plegar=function(si){det.style.display=si?'none':'contents'; pl.setAttribute('aria-expanded',si?'false':'true'); pl.textContent=si?'Modo docente (abrir)':'Modo docente'; b.style.left=si?'auto':'12px'; document.body.style.paddingBottom=(b.offsetHeight+28)+'px';};
  pl.onclick=function(){plegar(det.style.display!=='none');};
  plegar(innerWidth<600);
  var ced=document.getElementById('c-cedula'), cla=document.getElementById('c-clave');
  if(J&&ced) ced.value='DOCENTE'; if(J&&cla) cla.value='ensayo';
  var bc=document.getElementById('bd-clave');
  if(bc) bc.onclick=function(){
    var ver=bc.dataset.ver!=='1'; bc.dataset.ver=ver?'1':''; bc.textContent=ver?'Ocultar respuestas':'Ver respuestas correctas';
    clave.forEach(function(k,i){
      var r=document.querySelector('input[name=p'+i+'][value="'+k+'"]'), l=r&&r.closest('label'); if(!l) return;
      l.style.outline=ver?'2px solid var(--pos,#5fb37a)':''; var s=l.querySelector('.bd-ok');
      if(ver&&!s){s=document.createElement('b');s.className='bd-ok';s.textContent='Correcta';s.style.cssText='margin-left:auto;color:var(--pos,#5fb37a);font-size:13px';l.appendChild(s);}
      if(!ver&&s) s.remove();
    });
  };
  var br=document.getElementById('bd-reiniciar');
  if(br) br.onclick=function(){try{localStorage.removeItem('econ-docente-ensayo');}catch(e){} location.reload();};
  document.getElementById('bd-salir').onclick=function(){
    salirDocente(); var raiz=document.querySelector('a.volver,a[href$="../"]'); location.href=raiz?raiz.getAttribute('href'):location.href;
  };
}
